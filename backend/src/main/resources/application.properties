# Composition root cho cấu hình Backend.
# Mỗi concern được tách vào application-{concern}.properties tương ứng.
spring.profiles.active=postgres
spring.profiles.include=security,cloudinary,mail,vnpay,google,ghn

# Xác thực JPA entities với schema CSDL hiện hành.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
