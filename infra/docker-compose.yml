services:
  # Cấu hình CSDL PostgreSQL 16 Độc lập cho PeakSneaker Dev Sandbox
  # Khởi chạy: docker compose -f infra/docker-compose.yml up -d
  postgres:
    image: postgres:16-alpine
    container_name: peaksneaker_dev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peaksneaker_db
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5434:5432"
    volumes:
      # Volume lưu trữ dữ liệu độc lập
      - peaksneaker_standalone_postgres_data:/var/lib/postgresql/data
      # Mount script DDL 24 bảng khởi tạo tự động
      - ./peaksneaker.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peaksneaker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  peaksneaker_standalone_postgres_data:
